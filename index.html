<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>勤怠</title>
<meta name="theme-color" content="#333333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="勤怠">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 方針: スマホ1画面のアプリ。上に濃いグレーのバー、下に3つのタブ。操作できる所は黄色。単一テーマ（明るい配色）で固定。 */
:root{
  --dark:#333333; --y:#ffd200; --ybg:#fff6cc; --ink:#222222; --muted:#777b80;
  --line:#dcdce0; --gray:#efeff3; --red:#e3241d; --blue:#3a8bd8; --green:#5cb531; --page:#e7e7ea;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;background:#fff;position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app.noNav{padding-bottom:24px}
/* 上のバー */
.bar{background:var(--dark);color:#fff;height:60px;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;position:sticky;top:0;z-index:5}
.bar .brand{text-align:center;font-weight:700;font-size:20px;letter-spacing:.08em}
.bar .brand small{font-size:11px;font-weight:400;border:1px solid #888;border-radius:3px;padding:0 4px;margin-left:6px;letter-spacing:0;vertical-align:middle}
.ib{background:none;border:0;color:#fff;height:60px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fbar{grid-template-columns:1fr auto 1fr}
.fbar .t{text-align:center;font-weight:700;font-size:18px}
.fbar button{background:none;border:0;color:#fff;cursor:pointer;height:60px;padding:0 14px;white-space:nowrap;text-align:left}
.fbar .go{color:var(--y);font-weight:700;text-align:right}
.fbar .go:disabled{color:#555;cursor:not-allowed}
.subbar{background:var(--gray);display:grid;grid-template-columns:52px 1fr 52px;align-items:center;height:56px;border-bottom:1px solid var(--line)}
.subbar b{text-align:center;font-size:18px}
.subbar button{background:none;border:0;font-size:28px;color:#4a5b6c;cursor:pointer;height:56px}
.datebar{background:#6b6b6b;color:#fff;text-align:center;font-weight:700;height:40px;display:flex;align-items:center;justify-content:center;position:relative}
.datebar input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.datebar.y{background:#f5d24a;color:var(--ink)}
/* タイムカード */
.clockbox{background:var(--gray);display:flex;gap:14px;align-items:center;justify-content:center;padding:18px 12px;box-shadow:0 3px 4px rgba(0,0,0,.08)}
.gtag{border:2px solid #555;border-radius:4px;padding:2px 8px;font-weight:700;color:#444;font-size:17px;white-space:nowrap}
.clk{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cdate{color:#666;font-size:14px;margin-top:6px}
.stk{display:grid;gap:3px}
.stk span{font-size:12px;font-weight:700;background:#fff;color:#888;border-radius:3px;padding:2px 8px;text-align:center}
.stk span.on{background:var(--dark);color:#fff}
.pad{padding:18px 16px}
.lbl{font-weight:700;color:#444;margin:6px 0 10px}
.sel{position:relative}
.sel select{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:4px;background:#fff;padding:12px 64px 12px 14px;font-size:17px}
.sel::after{content:"";position:absolute;right:0;top:0;bottom:0;width:52px;border-left:1px solid var(--line);background:#efefef linear-gradient(transparent,transparent);border-radius:0 4px 4px 0;pointer-events:none}
.sel::before{content:"";position:absolute;right:19px;top:50%;margin-top:-5px;border:7px solid transparent;border-top:11px solid #111;border-bottom:0;z-index:1;pointer-events:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.pc{border:0;border-radius:8px;background:var(--y);padding:22px 6px 18px;cursor:pointer;display:grid;justify-items:center;gap:6px}
.pc svg{width:72px;height:72px}
.pc b{font-size:30px;letter-spacing:.05em}
.pc span{font-size:14px}
.pc:disabled{background:#dedede;color:#888;cursor:not-allowed}
.pc:disabled svg{color:#fff}
.pc svg{color:#fff}
.brkrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.btn2{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px;cursor:pointer;font-weight:700}
.btn2:disabled{color:#bbb;cursor:not-allowed}
.today{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
.today li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.today ul{list-style:none;margin:0;padding:0}
/* シフト確認 */
.calhead{background:#9a9a9a;color:#fff;display:grid;grid-template-columns:44px 1fr 44px 74px;align-items:center;height:48px;padding-right:8px}
.calhead b{text-align:center;font-size:22px;font-weight:400}
.calhead button.nav{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;height:48px}
.calhead .todayb{background:#fff;color:var(--ink);border:0;border-radius:16px;padding:3px 0;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .wd{text-align:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.cal .d{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;height:64px;display:grid;align-content:center;justify-items:center;gap:4px;cursor:pointer;font-size:20px;font-variant-numeric:tabular-nums}
.cal .d:nth-child(7n){border-right:0}
.sun{color:var(--red)} .sat{color:var(--blue)} .oth{color:#aaa}
.cal .d.pk{background:var(--ybg)}
.dots{display:flex;gap:4px;height:9px}
.dots i{width:9px;height:9px;border-radius:50%}
.g{background:var(--green)} .yy{background:var(--y)} .k{background:#222} .w{background:#fff;border:1px solid #ccc} .gr{background:#bbb}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 16px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dhead{display:flex;justify-content:space-between;align-items:center;background:var(--gray);border-left:8px solid var(--y);padding:8px 10px 8px 14px;gap:8px;flex-wrap:wrap}
.dhead b{font-size:21px}
.pill{background:var(--dark);color:#fff;border:0;border-radius:14px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:15px}
.dacts{display:flex;gap:6px}
.dsec{padding:14px 16px;border-bottom:1px solid var(--line)}
.dsec.res{background:#fcf5df}
.dsec .hd{display:flex;justify-content:space-between;margin-bottom:8px}
.dsec .hd b{font-size:18px}
.two{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.red{color:var(--red);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.bl{font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.chip{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;border:1px solid;font-weight:700;margin:2px 4px 0 0;white-space:nowrap}
.c-ok{color:#2f7d4f} .c-ng{color:#bf3528} .c-pd{color:#a86a12} .c-lv{color:#2f6db3} .c-hw{color:#8a4fc0}
/* 各種申請 */
.menu{display:grid;gap:18px;padding:22px 16px}
.ybtn{background:var(--y);border:0;border-radius:8px;padding:18px;font-weight:700;font-size:19px;cursor:pointer;letter-spacing:.04em}
/* フォーム */
.form{padding:14px 16px 30px}
.form .lbl{display:flex;gap:10px;align-items:center;margin:18px 0 10px}
.req{color:var(--red);font-weight:700}
.tr{display:grid;grid-template-columns:1fr 32px 1fr 46px;align-items:center;gap:6px}
.tr input{width:100%;border:1px solid #bbb;border-radius:6px;padding:12px 6px;font-size:19px;text-align:center;background:#fff;min-height:54px}
.tr input:nth-of-type(2){background:#f4f4f7}
.tr span{text-align:center;font-size:20px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:#d6d6d6;color:#fff;font-size:22px;font-weight:700;cursor:pointer}
textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:10px;min-height:110px;font-size:17px;resize:vertical}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.rd{display:flex;align-items:center;gap:8px;cursor:pointer;color:#555;font-size:18px}
.rd input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#e2e2e2;margin:0;display:grid;place-items:center;cursor:pointer}
.rd input:checked{background:#fff;box-shadow:0 0 0 1px #ddd}
.rd input:checked::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--y)}
.period{display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;gap:6px}
.period input,.period .fix{border:1px solid #bbb;border-radius:6px;padding:12px 8px;font-size:16px;background:#fff;width:100%;min-height:50px;text-align:center;color:#666}
.period span{text-align:center}
.cnt{text-align:right;font-weight:700;margin-top:8px}
.err{color:var(--red);font-size:14px;margin-top:16px;min-height:1.5em}
.note{font-size:13px;color:var(--muted);margin-top:8px}
/* 一覧・管理 */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k2{font-size:12px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--gray);font-size:12px;color:#555}
th:first-child,td:first-child,.l{text-align:left}
tr.off td{background:#f7f7f9;color:#999}
.bar45{height:8px;background:var(--gray);border-radius:4px;overflow:hidden;min-width:80px}
.bar45 i{display:block;height:100%;background:var(--green)}
.bar45 i.w{background:#e0a020} .bar45 i.b{background:var(--red)}
.ritem{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center}
.ritem .s{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px}
.ok,.ng,.plain{border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:700;background:#fff}
.ok{border:1px solid #2f7d4f;color:#2f7d4f} .ng{border:1px solid #bf3528;color:#bf3528} .plain{border:1px solid var(--line)}
h2{font-size:18px;margin:4px 0 12px}
/* 下のタブ */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--dark);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;color:#fff;padding:10px 0 12px;display:grid;justify-items:center;gap:4px;cursor:pointer;font-weight:700;font-size:14px}
.tabs button svg{width:30px;height:30px}
.tabs button.on{color:var(--y)}
/* メニュー（ドロワー） */
.dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(300px,85vw);background:#fff;z-index:21;overflow-y:auto;padding-bottom:20px}
.dr .who{background:var(--dark);color:#fff;padding:18px 16px}
.dr .who label{font-size:12px;color:#ccc;display:block;margin-bottom:6px}
.dr .who select{width:100%;padding:8px;border-radius:4px;border:0;color:var(--ink)}
.dr h4{margin:14px 16px 4px;font-size:12px;color:var(--muted)}
.dr button.it{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--gray);padding:14px 16px;cursor:pointer;font-size:16px}
.bn{background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.foot{font-size:12px;color:var(--muted);padding:16px}
.fx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.fx-warn{border-color:#e0a020;background:#fffaf0}
.fx-over{border-color:var(--red);background:#fff5f4}
.fxh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fxh span{font-size:13px;color:var(--muted);font-weight:700}
.fxh b{font-size:24px;font-variant-numeric:tabular-nums}
.fxh b small{font-size:13px;color:var(--muted)}
.fxbar{height:10px;background:var(--gray);border-radius:5px;overflow:hidden;margin:6px 0}
.fxbar i{display:block;height:100%;background:var(--green)}
.fx-warn .fxbar i{background:#e0a020} .fx-over .fxbar i{background:var(--red)}
.fxs{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.fx-red{color:var(--red);font-weight:700}
.fxn{font-size:13px;color:#a86a12;font-weight:700;margin-top:4px}
td.ov{color:var(--red);font-weight:700}

.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.minis .btn2{padding:10px 4px;font-size:15px}
.stk span{padding:1px 8px}
.ib{position:relative}
.dotb{position:absolute;top:16px;right:14px;width:9px;height:9px;border-radius:50%;background:#ff5a4e}
.dots i.sq{border-radius:1px;background:var(--red)}
.dots i.rd,.legend i.rd{background:var(--red)}
.legend i.sq{border-radius:1px;background:var(--red)}
.dots i.go,.legend i.go{background:#fff;border:2px solid var(--green);box-sizing:border-box}
.ybtn small{display:block;font-size:12px;font-weight:400;margin-top:2px}
.segt{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.segt button{flex:1;border:0;background:#fff;padding:9px 6px;cursor:pointer;font-weight:700;color:#666}
.segt button.on{background:var(--dark);color:#fff}
.chipnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chipnav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.chipnav button.on{background:var(--y);border-color:var(--y)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 10px;border-bottom:1px solid var(--line)}
.bulk .s{flex:1;color:var(--muted);font-size:13px}
.cb{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.cb input{width:22px;height:22px}
.ritem .cb{align-self:flex-start;padding-top:2px}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:13px 14px;cursor:pointer;font-size:16px;text-align:left}
.li:last-child{border-bottom:0}
.li b{color:var(--muted);font-weight:700}
.tile.tl{text-align:left;cursor:pointer;background:#fff;font:inherit}
.radios.r3{grid-template-columns:repeat(3,1fr);gap:10px 6px}
.radios.r3 .rd{font-size:15px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);background:#fff;border-radius:12px;padding:18px;z-index:22}
.alrt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:6px solid #e0a020;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.alrt.bad{border-left-color:var(--red)}
.alrt .acts{flex-shrink:0;flex-direction:column}
.sm{padding:4px 10px!important;font-size:13px}
.ov{color:var(--red);font-weight:700}
table.grid th,table.grid td{padding:5px 4px;font-size:12px;text-align:center}
table.grid th.sun{color:var(--red)} table.grid th.sat{color:var(--blue)}
.stick{position:sticky;left:0;background:#fff;z-index:1;text-align:left!important;white-space:nowrap;padding-left:8px!important}
thead .stick{background:var(--gray);z-index:2}
.cc{min-width:30px}
.c-abs{color:#bf3528;font-weight:700}.c-err{background:#fde4e1;color:#bf3528;font-weight:700}.c-lvx{background:#e6f0fb;color:#2f6db3;font-weight:700}
.c-holw{background:#f1e8fa;color:#8a4fc0;font-weight:700}.c-hi{background:#fff1d6}.c-wk{color:#2f7d4f;font-weight:700}.c-off{color:#bbb}
.curm{outline:2px solid var(--y);outline-offset:-2px}
.dlink{background:none;border:0;cursor:pointer;font:inherit;color:inherit;padding:0;line-height:1.3}
.dpick{position:relative;cursor:pointer}
.dpick input{position:absolute;inset:0;opacity:0;cursor:pointer}
td input[type=time]{border:1px solid #bbb;border-radius:4px;padding:4px;font-size:14px}
.err{min-height:0}

.setg{border:1px solid var(--line);border-radius:10px;padding:4px 14px 14px}
.setg .lbl{margin-top:14px}
.setg .s{color:var(--muted);font-size:13px;margin:4px 0 0}
table.emp select,table.emp input{border:1px solid #bbb;border-radius:4px;padding:4px;font-size:13px;background:#fff}
table.emp input[type=number]{width:60px}
table.emp td{text-align:left}

.pay{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fffdf3}
.pay div{display:grid}
.pay b{font-size:20px;font-variant-numeric:tabular-nums}
.pay .arw{font-size:22px;color:var(--muted)}
.gps{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
a.chip{text-decoration:none}
.c-half{background:#e9f6ef;color:#2f7d4f;font-weight:700}

/* ===== 管理者画面（PC） ===== */
.app.adm{max-width:none;padding:0;background:#eef0f3;min-height:100%}
.ahead{position:sticky;top:0;z-index:40;height:52px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;gap:4px;padding:0 12px}
.alogo{font-weight:700;font-size:19px;letter-spacing:.06em;color:#1f2a37;display:flex;align-items:baseline;gap:8px}
.alogo small{font-size:11px;font-weight:400;color:#7a8592;letter-spacing:0;border:1px solid #d5dae0;border-radius:3px;padding:0 5px}
.asp{flex:1}
.ahl{background:none;border:0;padding:8px 10px;font-size:13px;color:#4a5562;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ahl:hover{background:#f1f3f5}
.amb{display:none;background:none;border:0;font-size:22px;padding:4px 10px;cursor:pointer}
.auser{position:relative}
.udrop{position:absolute;right:0;top:44px;width:260px;background:#fff;border:1px solid #dfe3e8;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;display:grid;gap:8px;z-index:50}
.udrop button{background:#f5f6f8;border:0;border-radius:6px;padding:9px;text-align:left;cursor:pointer;font-size:14px}
.udrop label{font-size:12px;color:#7a8592}
.udrop select{padding:6px;border:1px solid #ccd2d8;border-radius:4px}
.awrap{display:flex;align-items:flex-start}
.aside{position:sticky;top:52px;height:calc(100vh - 52px);width:60px;flex-shrink:0;background:#1f2a37;color:#c9d3de;z-index:35;transition:width .15s;display:flex;flex-direction:column}
.aside:hover,.aside:focus-within{width:210px}
.aside-in{flex:1;padding-top:6px}
.ag{position:relative}

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
/* ===== 基本設定 ===== */
const W=["日","月","火","水","木","金","土"];
let GROUPS=["本社工事部"];
let STD={start:"08:00",end:"18:00",brks:[["10:00","10:30"],["12:00","13:00"],["15:00","15:30"]]};
let TPL=[
 {name:"通常勤務 8:00〜18:00",start:"08:00",end:"18:00",brks:[["10:00","10:30"],["12:00","13:00"],["15:00","15:30"]]},
 {name:"早出 7:00〜17:00",start:"07:00",end:"17:00",brks:[["09:00","09:30"],["12:00","13:00"],["15:00","15:30"]]},
 {name:"午前のみ 8:00〜12:00",start:"08:00",end:"12:00",brks:[["10:00","10:30"]]},
 {name:"午後のみ 13:00〜18:00",start:"13:00",end:"18:00",brks:[["15:00","15:30"]]}
];
const LEAVE=["年次有給","振休","代休","特別休暇"];
let SPECIAL={"夏季休暇":3,"年末年始休暇":4,"創立記念日":1};
const FIX_SUBS=["打刻修正","欠勤","遅刻取消","早退取消","実績確定"];
const STD_WORK=480, LIM_M=45*60, LIM_Y=360*60, LIM_TIMES=6, NIGHT=[[0,300],[1320,1740],[2760,3180]];
const KEY="kintai-proto-v8";
const GRANT=[10,11,12,14,16,18,20];
const ROLE_L={admin:"勤怠管理者",group:"グループ管理者",emp:"従業員"};
const DEF_RULES={rIn:0,rOut:0,startAtShift:false,chokkoStart:false,chokkiEnd:false,otMode:"actual",brkMode:"punch",interval:11,autoOT:true,closeDay:25,payDay:0,amEnd:"13:00",pmStart:"12:00",gpsMode:"record"};
const DEF_SITES=[{id:"s1",name:"本社",lat:34.5185,lng:135.8430,r:200},{id:"s2",name:"現場A（造成工事）",lat:34.6990,lng:135.7700,r:300},{id:"s3",name:"現場B（道路改良工事）",lat:34.6050,lng:135.7950,r:300}];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kd=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const toMin=s=>{if(!s)return null;const[a,b]=s.split(":").map(Number);return a*60+b};
const hm=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmT=s=>{if(!s)return s;const m=toMin(s);return m>=1440?"翌"+hm(m-1440):s};
const vT=s=>{if(!s)return "";const m=toMin(s);return m>=1440?hm(m-1440):s};
const p24=s=>hm(toMin(s)+1440);
const segsOf=r=>r.segs&&r.segs.length>1?r.segs:[[r.in,r.out]];
const segsTxt=r=>segsOf(r).map(x=>`${fmT(x[0])} 〜 ${x[1]?fmT(x[1]):"--:--"}`).join(" ／ ");
const dur=m=>m==null?"—":`${Math.floor(m/60)}:${pad(m%60)}`;
const hrs=m=>(m/60).toFixed(1);
const md=k=>{const d=kd(k);return `${d.getMonth()+1}月${d.getDate()}日 (${W[d.getDay()]})`};
const mdS=k=>{const d=kd(k);return `${d.getMonth()+1}/${d.getDate()}(${W[d.getDay()]})`};
const mLabel=m=>{const[y,mm]=m.split("-");return `${y}年${+mm}月度`};
const mRange=m=>`${mdS(periodStart(m))}〜${mdS(periodEnd(m))}`;
const ov=(a1,a2,b1,b2)=>Math.max(0,Math.min(a2,b2)-Math.max(a1,b1));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayK=()=>ymd(NOW());
const addDays=(k,n)=>{const d=kd(k);d.setDate(d.getDate()+n);return ymd(d)};
const addMonth=(m,n)=>{const[y,mm]=m.split("-").map(Number);const d=new Date(y,mm-1+n,1);return ymd(d).slice(0,7)};
const nowHM=()=>{const n=NOW();return hm(n.getHours()*60+n.getMinutes())};
const nowStr=()=>{const n=NOW();return `${ymd(n)} ${pad(n.getHours())}:${pad(n.getMinutes())}`};
const isHol=k=>kd(k).getDay()===0;
const calEnd=m=>{const[y,mm]=m.split("-").map(Number);return ymd(new Date(y,mm,0))};
const CD=()=>+((typeof S!=="undefined"&&S&&S.rules)?S.rules.closeDay:DEF_RULES.closeDay)||0;
const periodStart=m=>{const c=CD();return c?addDays(addMonth(m,-1)+"-"+pad(c),1):m+"-01"};
const periodEnd=m=>{const c=CD();return c?m+"-"+pad(c):calEnd(m)};
const periodOf=k=>{const c=CD();return c&&+k.slice(8,10)>c?addMonth(k.slice(0,7),1):k.slice(0,7)};
const lastDay=periodEnd;
function payDate(m){const p=+S.rules.payDay||0;let k=p?m+"-"+pad(p):calEnd(m);while([0,6].includes(kd(k).getDay()))k=addDays(k,-1);return k}
const daysTo=k=>Math.round((kd(k)-kd(todayK()))/864e5);
const daysOf=m=>{const out=[];for(let k=periodStart(m);k<=periodEnd(m);k=addDays(k,1))out.push(k);return out};
const fyStart=()=>{const p=periodOf(todayK());const y=+p.slice(5,7)>=4?+p.slice(0,4):+p.slice(0,4)-1;return `${y}-04`};

let TOK=null, OFF=0, BUSY=false;
try{TOK=localStorage.getItem("kintai_token")}catch(e){}
function NOW(){return new Date(Date.now()+OFF)}
let S=null, F=null, drawer=false, SELQ=new Set(), MODAL=null, EDIT=null;

/* ===== サーバーとの通信 ===== */
const UIKEY="kintai_ui";
function save(){if(!S)return;try{localStorage.setItem(UIKEY,JSON.stringify({view:S.view,sel:S.sel,cal:S.cal,ui:S.ui,af:S.af,pg:S.pg}))}catch(e){}}
function log(){}
function uiDefaults(me){const tk=todayK(),cur=periodOf(tk),prev=addMonth(cur,-1);return {view:"punch",sel:tk,cal:tk.slice(0,7),pg:{},ui:{mTab:"sum",agOpen:null,apprType:"打刻修正",apprTab:"pending",hTab:"pending",hMonth:cur,hType:"すべて",dDate:tk,mMonth:cur,cMonth:prev,oKind:"勤務データ",oMonth:prev,oEmp:me,lMonth:cur},af:{grp:"すべて",q:"",day:tk,per:"20",stat:"在職"}}}
const STKEY="kintai_state";
function keepState(d){try{localStorage.setItem(STKEY,JSON.stringify({tok:TOK,d}))}catch(e){try{localStorage.removeItem(STKEY)}catch(x){}}}
function cachedState(){try{const o=JSON.parse(localStorage.getItem(STKEY)||"null");return o&&o.tok===TOK?o.d:null}catch(e){return null}}
function applyServer(d){
 OFF=new Date(d.now.replace(" ","T")).getTime()-Date.now();
 GROUPS=d.rules.groups;STD=d.rules.shift;TPL=d.rules.templates;SPECIAL=d.rules.special;
 const keep=S&&S.ui?{view:S.view,sel:S.sel,cal:S.cal,ui:S.ui,af:S.af,pg:S.pg}:null;
 S=Object.assign({},d);
 let ui=keep; if(!ui){try{ui=JSON.parse(localStorage.getItem(UIKEY)||"null")}catch(e){ui=null}}
 const def=uiDefaults(d.me);
 if(!ui||!ui.ui||!ui.af){ui=def}else{ui.ui=Object.assign({},def.ui,ui.ui);ui.af=Object.assign({},def.af,ui.af,{day:ui.af.day||def.af.day});if(!keep){ui.sel=def.sel;ui.cal=def.cal;ui.af.day=def.af.day;["lMonth","mMonth","hMonth"].forEach(k=>ui.ui[k]=def.ui[k])}}
 Object.assign(S,ui);
}
function api(fn,...args){
 if(window.google&&google.script&&google.script.run) return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)});
 const url=window.KINTAI_API;
 if(!url||url.indexOf("https://script.google.com/")!==0) return Promise.reject(new Error("config.js にアプリのURLが入っていません。管理者に連絡してください"));
 return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})})
  .catch(()=>{throw new Error("通信できませんでした。電波の良い所でもう一度押してください")})
  .then(r=>r.json().catch(()=>{throw new Error("サーバーの返事が読めませんでした。管理者に連絡してください")}))
  .then(j=>{if(!j.ok)throw new Error(j.error);return j.data});
}
const msgOf=e=>String((e&&e.message)||e).replace(/^(Error|Exception|ScriptError)[:：]\s*/,"");
function showBusy(on,t){const b=document.getElementById("busy");if(!b)return;b.style.display=on?"flex":"none";if(t)b.querySelector("span").textContent=t;else b.querySelector("span").textContent="通信中…"}
async function call(fn,...args){
 if(BUSY) return null; BUSY=true; showBusy(true);
 try{return await api(fn,...args)}
 catch(e){const m=msgOf(e);if(m==="LOGIN"){forget();toast("ログインし直してください");render()}else toast(m);return null}
 finally{BUSY=false;showBusy(false)}
}
let SEQ=0;
async function reload(fresh){const d=await call("getState",TOK,!!fresh);if(d){SEQ++;applyServer(d);keepState(d);render()}}
async function quietReload(){if(!TOK||BUSY)return;const my=++SEQ;setSync(true);
 try{const d=await api("getState",TOK);if(my!==SEQ||BUSY||!TOK)return;if(MODAL||EDIT||(S&&S.view==="form")){keepState(d);return}applyServer(d);keepState(d);render()}
 catch(e){const m=msgOf(e);if(m==="LOGIN"){forget();toast("ログインし直してください");render()}}
 finally{setSync(false)}}
function setSync(on){let el=document.getElementById("sync");if(!el){el=document.createElement("div");el.id="sync";el.textContent="更新中…";document.body.appendChild(el)}el.style.display=on?"block":"none"}
async function act(name,p){SEQ++;const r=await call("act",TOK,name,p||{});if(r){SEQ++;applyServer(r.state);keepState(r.state);save();render();if(r.msg)toast(r.msg)}return r}
function forget(){TOK=null;S=null;try{localStorage.removeItem("kintai_token");localStorage.removeItem(UIKEY);localStorage.removeItem(STKEY)}catch(e){}}
let WARM=null,WATCH=null;
function geoWarm(){ // 位置情報をあらかじめ取り始めておく（許可済みのときだけ）
 if(WATCH!=null||!navigator.geolocation)return;
 try{WATCH=navigator.geolocation.watchPosition(p=>{WARM={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()}},()=>{},{enableHighAccuracy:true,maximumAge:60000,timeout:20000});
  setTimeout(()=>{try{navigator.geolocation.clearWatch(WATCH)}catch(e){}WATCH=null},180000)}catch(e){}
}
function geoWarmIfGranted(){try{if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted")geoWarm()}).catch(()=>{})}catch(e){}}
function getPosReal(){return new Promise(res=>{
 if(WARM&&Date.now()-WARM.t<90000&&WARM.acc<=150){res(WARM);return}
 let best=WARM&&Date.now()-WARM.t<300000?WARM:null,done=false,wid=null;
 const fin=()=>{if(done)return;done=true;try{if(wid!=null)navigator.geolocation.clearWatch(wid)}catch(e){}res(best)};
 const take=p=>{const o={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()};if(!best||o.acc<=best.acc||Date.now()-best.t>60000)best=o;WARM=best;if(o.acc<=60)fin()};

function distM(a,b,c,d){const R6=6371000,t=x=>x*Math.PI/180;const dl=t(c-a),dg=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return Math.round(2*R6*Math.asin(Math.sqrt(h)))}
function nearest(lat,lng){let best=null;S.sites.forEach(x=>{const d=distM(lat,lng,x.lat,x.lng);if(!best||d<best.dist)best={site:x.name,id:x.id,dist:d,ok:d<=x.r}});return best||{site:"",dist:0,ok:false}}
function simPos(){const x=S.sites.find(y=>y.id===S.simLoc);return x?{lat:x.lat+0.0004,lng:x.lng+0.0003,acc:15,sim:true}:{lat:34.6500,lng:135.9500,acc:20,sim:true}}

 try{navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),sim:false}),()=>fin(simPos()),{enableHighAccuracy:true,timeout:2000,maximumAge:0})}catch(e){fin(simPos())}})}

function dayDetail(k){

function decide(ids,ok,comment){
 let done=0,skip=0,step1=0; const me=ME();
 ids.forEach(id=>{const q=S.requests.find(x=>x.id===id);if(!q||!canAct(q))return;if(closedInfo(q.emp,q.date)){skip++;return}
  const proxy=isAdm()&&q.step===1;
  q.trail=(q.trail||[]).concat([{by:me.name,at:nowStr(),act:ok?(isAdm()?"最終承認":"一次承認"):"否認",comment:comment||"",proxy}]);
  if(ok&&!isAdm()&&q.step===1){q.step=2;log(`一次承認：${emp(q.emp).name} ${typeLabel(q)} ${q.date}`,q.emp);step1++;done++;return}
  q.status=ok?"承認":"否認";q.by=me.name+(proxy&&ok?"（代理承認）":"");q.byAt=nowStr();q.comment=comment||"";
  if(ok&&q.type==="打刻修正"&&q.sub==="打刻修正"){const key=q.emp+"|"+q.date, old=S.records[key]||{};q.prev=JSON.parse(JSON.stringify(old));S.records[key]={in:q.start||old.in||null,out:q.end||old.out||null,brks:(q.brks&&q.brks.length)?q.brks:[],outs:[],chokko:q.chokko,chokki:q.chokki,group:q.group}}
  log(`${ok?"承認":"否認"}：${emp(q.emp).name} ${typeLabel(q)} ${q.date}`,q.emp); done++;});
 SELQ.clear();
 toast(`${done}件を${ok?"承認":"否認"}しました${step1?"（一次承認。勤怠管理者の最終承認に回りました）":""}${skip?`（締め処理済みの月の${skip}件は処理できませんでした。締めを解除してから処理してください）`:""}`);
}
function undo(id){
 const q=S.requests.find(x=>x.id===id); if(!q||!isAdm()) return;
 if(closedInfo(q.emp,q.date)) return toast("締め処理済みの月のため取り消せません");

}

/* ---- TOP：予定と出勤 ---- */
function aTop(){
 const k=AF().day, tk=todayK(), cur=periodOf(tk);
 const rows=fEmps().slice(0,perN()).map(e=>{
  const r=rec(e.id,k)||{}, sh=shiftOf(e.id,k), c=calc(e.id,k), st=dayState(e.id,k), lv=leaveOf(e.id,k), abs=subOf(e.id,k,"欠勤"), lk=closedInfo(e.id,k);
  const rawLate=!!(r.in&&sh&&!isHol(k)&&!r.chokko&&toMin(r.in)>toMin(sh.start)), rawEarly=!!(r.out&&sh&&!isHol(k)&&!r.chokki&&toMin(r.out)<toMin(sh.end));
  const judge=st==="err"?'<span class="jd jng">打刻エラー</span>':st==="miss"?'<span class="jd jng">未打刻</span>':st==="abs"?'<span class="jd jng">欠勤</span>':c&&(c.late||c.early)?`<span class="jd jwn">${c.late?"遅刻":""}${c.late&&c.early?"・":""}${c.early?"早退":""}</span>`:st==="working"?'<span class="jd jok">勤務中</span>':c?'<span class="jd jok">正常</span>':'<span class="jd">—</span>';
  const note=[];if(lv)note.push(`<span class="chip c-lv">${lv.type==="特別休暇"?esc(lv.kind):lv.type}${lv.half!=="全日"?"・"+lv.half:""}</span>`);if(r.chokko)note.push('<span class="chip">直行</span>');if(r.chokki)note.push('<span class="chip">直帰</span>');if(S.requests.some(q=>q.emp===e.id&&q.date===k&&q.status==="承認待ち"))note.push('<span class="chip c-pd">申請中</span>');
  const cancelBtn=(sub,raw)=>!raw?"":subOf(e.id,k,sub)?'<span class="s">取消済</span>':lk||!isAdm()?"":`<button class="mini" data-act="admSub" data-v="${sub}" data-e="${e.id}">取消</button>`;
  return `<tr><td class="l"><button class="lnk" data-act="toDaily" data-v="${k}">${esc(e.name)}</button></td><td>${sh?`${sh.start} - ${sh.end}`:lv&&lv.half==="全日"?"休暇":isHol(k)?"休日":"—"}</td><td>${r.in?segsTxt(r):""}</td>
   <td>${!r.in&&sh&&!lk&&isAdm()?`<select data-abs="${e.id}" aria-label="勤怠状況"><option value="">選択してください</option><option value="欠勤" ${abs?"selected":""}>欠勤</option></select>`:r.in?"出勤":lv?"休暇":"—"}</td>
   <td>${cancelBtn("遅刻取消",rawLate)}</td><td>${cancelBtn("早退取消",rawEarly)}</td><td class="l">${r.locs&&r.locs.in?locChip(r.locs.in):""}</td><td class="l">${note.join("")}</td><td>${judge}</td></tr>`}).join("");
 const info=`<div class="istrip"><button data-act="ago" data-v="a_ap" data-x="${(pend()[0]&&apprKey(pend()[0]))||"打刻修正"}"><span>未承認の申請</span><b>${pend().length}件</b></button><button data-act="ago" data-v="a_alert"><span>アラート</span><b>${alerts().length}件</b></button><button data-act="ago" data-v="a_close"><span>${mLabel(cur)}の締め日まで</span><b>あと${Math.max(0,daysTo(periodEnd(cur)))}日</b></button><button data-act="ago" data-v="a_close"><span>給与支払日（当月払い）</span><b>${mdS(payDate(cur))}</b></button></div>`;
 return page(`予定と出勤　${kd(k).getFullYear()}年${kd(k).getMonth()+1}月${kd(k).getDate()}日(${W[kd(k).getDay()]})`,
  info+sbox([fDay(),fGrp(),fName(),fStat()])+`<section class="rbox"><div class="rbh">${esc(AF().grp==="すべて"?"全打刻グループ":AF().grp)}</div><div class="tbl"><table class="at"><thead><tr><th class="l">名前</th><th>スケジュール</th><th>実績</th><th>勤怠状況</th><th>遅刻取消処理</th><th>早退取消処理</th><th class="l">打刻場所（GPS）</th><th class="l">備考</th><th>実績判定</th></tr></thead><tbody>${rows||'<tr><td colspan="9">該当する従業員がいません</td></tr>'}</tbody></table></div></section>`);
}

/* ---- 日次スケジュール ---- */
function aDsch(){
 const k=AF().day, H=h=>`${(h/24*100).toFixed(3)}%`;
 const rows=fEmps().slice(0,perN()).map(e=>{
  const sh=shiftOf(e.id,k), r=rec(e.id,k), pq=S.requests.find(q=>q.emp===e.id&&q.type==="スケジュール"&&q.date===k&&q.status==="承認待ち");
  let bars="",work=0,brk=0;
  if(sh){const s=toMin(sh.start),en=toMin(sh.end);bars+=`<i class="gb" style="left:${H(s/60)};width:${H((en-s)/60)}"></i>`;sh.brks.forEach(b=>{const bs=toMin(b[0]),be=toMin(b[1]);brk+=be-bs;bars+=`<i class="gbr" style="left:${H(bs/60)};width:${H((be-bs)/60)}"></i>`});work=en-s-brk}
  if(pq&&!pq.off){const s=toMin(pq.start),en=toMin(pq.end);bars+=`<i class="gp" style="left:${H(s/60)};width:${H((en-s)/60)}" title="承認待ちの希望シフト"></i>`}
  if(r&&r.in){segsOf(r).forEach(x=>{const s=toMin(x[0]),en=Math.min(1440,x[1]?toMin(x[1]):k===todayK()?toMin(nowHM()):s);bars+=`<i class="ga" style="left:${H(s/60)};width:${H(Math.max(0,en-s)/60)}" title="実績"></i>`})}
  return `<tr><td class="l stick">${esc(e.name)}</td><td>${sh?sh.start+"〜"+sh.end:(leaveOf(e.id,k)?"休暇":"休日")}</td><td>${sh?sh.brks.map(b=>b[0]+"〜"+b[1]).join("<br>"):""}</td><td class="gcell"><div class="gline">${bars}</div></td><td>${dur(work)}</td><td>${dur(brk)}</td></tr>`}).join("");
 const hrsH=[...Array(25).keys()].map(h=>`<span style="left:${H(h)}">${h}</span>`).join("");
 return page("日次スケジュール",sbox([fDay(),fGrp(),fName()])+`<section class="rbox"><div class="rbh">${md(k)}<span class="lg"><i class="gb"></i>登録済みのスケジュール <i class="gp"></i>希望シフト（承認待ち） <i class="ga"></i>実績</span></div>
 <div class="tbl"><table class="at gantt"><thead><tr><th class="l stick">従業員名</th><th>出勤〜退勤</th><th>休憩</th><th class="gcell"><div class="ghours">${hrsH}</div></th><th>勤務</th><th>休憩</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <p class="note">スケジュールを変えるときは「月次スケジュール」で日付のマスを押してください。</p>`);
}

/* ---- 日次勤務実績 ---- */
function aDres(){
 const k=AF().day;
 const row=e=>{const r=rec(e.id,k)||{},c=calc(e.id,k),sh=shiftOf(e.id,k),st=dayState(e.id,k),lv=leaveOf(e.id,k);const ch=[];if(lv)ch.push(`<span class="chip c-lv">${lv.type==="特別休暇"?esc(lv.kind):lv.type}${lv.half!=="全日"?"・"+lv.half:""}</span>`);if(c&&c.late)ch.push('<span class="chip c-ng">遅刻</span>');if(c&&c.early)ch.push('<span class="chip c-ng">早退</span>');if(ST_CHIP[st])ch.push(ST_CHIP[st]);if(r.chokko)ch.push('<span class="chip">直行</span>');if(r.chokki)ch.push('<span class="chip">直帰</span>');if(subOf(e.id,k,"実績確定"))ch.push('<span class="chip c-ok">確定</span>');if(c&&c.ot)ch.push(`<span class="chip c-pd">残業${dur(c.ot)}</span>`);
  const editing=EDIT&&EDIT.id===e.id&&EDIT.k===k, lk=closedInfo(e.id,k);
  return `<tr><td class="l">${esc(e.name)}</td><td>${sh?sh.start+"〜"+sh.end:"休"}</td>${editing?`<td><input type="time" id="ein" value="${vT(r.in)}" aria-label="出勤"></td><td><input type="time" id="eout" value="${vT(r.out)}" aria-label="退勤"></td><td colspan="5"><button class="cyan sm" data-act="esave">保存</button> <button class="gray sm" data-act="ecancel">やめる</button></td>`:`<td>${fmT(r.in)||"—"}</td><td>${fmT(r.out)||"—"}${r.segs&&r.segs.length>1?`<div class="s">${r.segs.length}回勤務</div>`:""}</td><td>${c?dur(c.brk):"—"}</td><td>${c?dur(c.work):"—"}</td><td>${c?dur(c.hol?c.holMin:c.ot):"—"}</td><td>${c?dur(c.night):"—"}</td><td class="l">${ch.join("")}</td>`}<td class="l">${r.locs?(r.locs.in?"出 "+locChip(r.locs.in):"")+(r.locs.out?"<br>退 "+locChip(r.locs.out):""):""}</td><td>${editing||lk||!isAdm()?(lk?'<span class="s">締め済</span>':""):`<button class="mini" data-act="edit" data-v="${e.id}">編集</button>`}</td></tr>`};
 return page("日次勤務実績",sbox([fDay(),fGrp(),fName(),fStat()])+`<section class="rbox"><div class="rbh">${md(k)}</div><div class="tbl"><table class="at"><thead><tr><th class="l">名前</th><th>スケジュール</th><th>出勤</th><th>退勤</th><th>休憩</th><th>実働</th><th>残業</th><th>深夜</th><th class="l">状態</th><th class="l">打刻場所</th><th></th></tr></thead><tbody>${fEmps().slice(0,perN()).map(row).join("")}</tbody></table></div></section>
 <p class="note">「編集」で実績を直接直せます（勤怠管理者のみ）。直した内容は「履歴データ」に記録されます。</p>`);
}

/* ---- 月次勤務実績 ---- */
function aMres(){
 const m=S.ui.mMonth, days=daysOf(m), tab=S.ui.mTab||"sum", es=fEmps().slice(0,perN());

 ${rows.map(x=>`<tr><td><input type="checkbox" data-act="closeChk" data-v="${x.g}" ${CLOSESEL.has(x.g)?"checked":""} aria-label="${x.g}"></td><td class="l">${x.g}</td><td>${x.n}</td>

 ${tab==="pending"&&list.length?`<div class="bbar"><button class="cyan" data-act="bulk" data-v="承認">選択して承認</button><button class="gray" data-act="bulk" data-v="否認">選択して否認</button></div>`:""}</section>

 else if(a==="esave"){const i=document.getElementById("ein").value,o=document.getElementById("eout").value;if(i&&o&&o<=i){toast("退勤は出勤より後の時刻にしてください");return}const key=EDIT.id+"|"+EDIT.k,old=S.records[key]||{brks:[],outs:[],group:emp(EDIT.id).group};const before=`${old.in||"—"}〜${old.out||"—"}`;if(!i&&!o)delete S.records[key];else S.records[key]=Object.assign({},old,{in:i||null,out:o||null});log(`管理者が実績を編集：${emp(EDIT.id).name} ${EDIT.k} ${before} → ${i||"—"}〜${o||"—"}`,EDIT.id);EDIT=null;toast("実績を直しました")}
 else if(a==="doclose"){const m=S.ui.cMonth;S.closed[m]=S.closed[m]||{};S.closed[m][v]={at:nowStr(),by:emp(S.me).name};log(`締め処理：${v} ${mLabel(m)}`);toast(`${v}の${mLabel(m)}を締めました`)}
 else if(a==="unclose"){const m=S.ui.cMonth;delete S.closed[m][v];log(`締め解除：${v} ${mLabel(m)}`);toast(`${v}の締めを解除しました`)}
 else if(a==="dismiss"){S.dismiss.push(v)}
 else if(a==="dismissAll"){alerts().forEach(x=>S.dismiss.push(x.id));toast("すべて確認済みにしました")}
 else if(a==="copyout"){const t=document.getElementById("outtxt");try{navigator.clipboard.writeText(t.value).then(()=>toast("コピーしました。Excelに貼り付けられます"),()=>{t.select();toast("文字を選びました。コピーしてください")})}catch(e){t.select()}return}
 else if(a==="addsite"){S.sites.push({id:"s"+Date.now(),name:"新しい現場",lat:34.6,lng:135.8,r:300});toast("現場を追加しました。名前と場所を入れてください")}
 else if(a==="delsite"){S.sites=S.sites.filter(x=>x.id!==v);toast("現場を削除しました")}
 else if(a==="simloc"){S.simLoc=v}
 else if(a==="rulesReset"){S.rules=Object.assign({},DEF_RULES);toast("就業規則を初めの設定に戻しました")}
 else if(a==="reset"){S=seed();F=null;drawer=false;SELQ.clear();EDIT=null;MODAL=null;toast("サンプルデータに戻しました")}
 else return;
 save();render();
});
document.addEventListener("input",ev=>{const el=ev.target;if(F&&el.dataset.f&&el.type!=="radio"&&el.type!=="date"&&el.tagName!=="SELECT"){setF(el.dataset.f,el.value);refreshValid()}});
document.addEventListener("change",ev=>{
 const el=ev.target;
 if(S&&serverChange(el)) return;
 if(el.dataset.af){AF()[el.dataset.af]=el.value;EDIT=null;save();render();return}
 if(el.dataset.abs){const e=el.dataset.abs,k=AF().day;S.requests=S.requests.filter(q=>!(q.adminSet&&q.type==="打刻修正"&&q.sub==="欠勤"&&q.emp===e&&q.date===k));if(el.value==="欠勤"){S.requests.push({id:"r"+(S.seq++),emp:e,type:"打刻修正",sub:"欠勤",date:k,at:nowStr(),reason:"管理者が登録",comment:"",status:"承認",by:ME().name,byAt:nowStr(),group:emp(e).group,step:2,trail:[],adminSet:true});log(`欠勤を登録：${emp(e).name} ${k}`,e)}save();render();return}
 if(el.id==="me2"){S.me=el.value;UMENU=false;save();render();return}
 if(el.id==="me"){S.me=el.value;drawer=false;save();render();return}
 if(el.id==="pg"){S.pg[S.me]=el.value;save();render();return}
 if(el.id==="ddate"&&el.value){S.ui.dDate=el.value;EDIT=null;save();render();return}
 if(el.dataset.rule){const k=el.dataset.rule;S.rules[k]=el.type==="checkbox"?el.checked:(["rIn","rOut","interval","closeDay","payDay"].includes(k)?Number(el.value):el.value);if(k==="closeDay"){const c=periodOf(todayK());["lMonth","mMonth","oMonth","hMonth"].forEach(x=>S.ui[x]=c);S.ui.cMonth=addMonth(c,-1)}log(`就業規則を変更：${k}`);save();render();toast("設定を変えました。集計を計算し直しました");return}
 if(el.dataset.site){const x=S.sites.find(y=>y.id===el.dataset.id),f=el.dataset.site;x[f]=f==="name"?el.value:Number(el.value)||0;log(`現場を変更：${x.name}`);save();render();return}
 if(el.dataset.ef){const e=emp(el.dataset.id),f=el.dataset.ef,old=e[f];e[f]=f==="fixed"?Math.max(0,Number(el.value)||0):el.value;
  if(f==="role"&&!S.emps.some(x=>x.role==="admin")){e[f]=old;toast("勤怠管理者が1人もいなくなるため変えられません");render();return}
  if(f==="role"&&e.role==="emp")S.emps.forEach(x=>{if(x.approver===e.id)x.approver=""});
  if(f==="approver"&&el.value===e.id){e[f]=old}
  log(`従業員設定を変更：${e.name} ${f}`,e.id);save();render();return}
 if(el.dataset.ui){S.ui[el.dataset.ui]=el.value;save();render();return}
 if(el.id==="seldate"&&el.value){S.sel=el.value;S.cal=el.value.slice(0,7);if(F){const ty=F.type,sub=F.sub;openForm(ty);F.sub=sub}save();render();return}
 if(F&&el.dataset.tpl){const tp=TPL.find(x=>x.name===el.value);F.tpl=el.value;if(tp){F.start=tp.start;F.end=tp.end;F.brks=[0,1,2,3,4].map(i=>tp.brks[i]?[tp.brks[i][0],tp.brks[i][1]]:["",""])}render();return}
 if(F&&el.dataset.f){let val=el.value;if(el.dataset.f==="off")val=el.value==="1";setF(el.dataset.f,val);if(el.dataset.f==="half"&&el.value!=="全日")F.dateTo=F.date;if(el.dataset.rr)render();else refreshValid()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){UMENU=false;ASIDE=false;if(MODAL){MODAL=null;render()}else if(drawer){drawer=false;render()}}});

document.addEventListener("submit",async ev=>{
 if(ev.target.id!=="loginf") return; ev.preventDefault();
 const id=document.getElementById("lid").value.trim(), pin=document.getElementById("lpin").value.trim();
 const tok=await call("login",id,pin); if(!tok) return;
 TOK=tok; try{localStorage.setItem("kintai_token",tok)}catch(e){} render(); await reload(); geoWarmIfGranted();
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&TOK&&S&&!BUSY){quietReload();geoWarmIfGranted()}});
if("serviceWorker" in navigator&&location.protocol==="https:"&&!(window.google&&google.script)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(TOK){const cs=cachedState();if(cs){try{applyServer(cs)}catch(e){S=null}}}
render();
if(TOK){if(S)quietReload();else reload();geoWarmIfGranted()}
setInterval(()=>{const c=document.getElementById("clk");if(c)c.textContent=clockStr()},1000);
})();

</script>
</body>
</html>
